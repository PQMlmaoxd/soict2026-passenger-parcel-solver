name: Benchmark

# Manual smoke benchmark: the current source against the submitted file on a few
# generated instances. Shared runners are noisy and the time limit is short, so
# the numbers only show that nothing broke. Real comparisons follow the
# protocol in docs/benchmarks.md.

on:
  workflow_dispatch:
    inputs:
      time_limit:
        description: Seconds per run
        default: "30"
        required: true
      configs:
        description: Pattern for the configuration names in benchmarks/mimic-configs.tsv
        default: "s1_0[1-4]"
        required: true
      seeds:
        description: Comma-separated solver seeds
        default: "42"
        required: true

permissions: {}

jobs:
  benchmark:
    name: Compare against the submitted file
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build both solvers and the tools
        run: |
          make build tools
          g++ -std=c++17 -O2 -w contest/SOICT2026_Round2_S4T2A8_SISR_v3_pkasg.cpp -o build/submitted
      - name: Generate instances
        env:
          CONFIGS: ${{ inputs.configs }}
        run: bash benchmarks/generate.sh build/benchmarks "$CONFIGS"
      - name: Run
        env:
          TIME_LIMIT: ${{ inputs.time_limit }}
          SEEDS: ${{ inputs.seeds }}
        run: |
          tools/target/release/bench \
            --solver build/submitted --solver build/solver \
            --instances build/benchmarks \
            --time "$TIME_LIMIT" --seeds "$SEEDS" --jobs 1 \
            --out build/results.csv | tee build/summary.txt
          {
            echo '```text'
            cat build/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: build/results.csv
          if-no-files-found: error
